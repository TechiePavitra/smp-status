<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Status - SteamForge SMP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="container">

        <section class="status-card">

            <div class="top">
                <div>
                    <p class="eyebrow">SteamForge SMP - TechnoBlade Never Dies...!</p>
                    <h1>Server Status</h1>
                </div>
            </div>


            <div class="divider"></div>


            <!-- ================= JAVA EDITION ================= -->

            <div class="edition">

                <div class="edition-header">
                    <div>
                        <h2>Java Edition</h2>
                        <p class="edition-subtitle">Minecraft Java Edition</p>
                    </div>

                    <div id="java-status-badge" class="badge offline">
                        <span class="dot"></span>
                        <span id="java-status-text">OFFLINE</span>
                    </div>
                </div>


                <div class="stats">

                    <div class="stat">
                        <span class="label">Ping</span>
                        <strong id="java-ping">—</strong>
                    </div>

                    <div class="stat">
                        <span class="label">Version</span>
                        <strong id="java-version">Unknown</strong>
                    </div>

                </div>

            </div>


            <div class="divider"></div>


            <!-- ================= BEDROCK EDITION ================= -->

            <div class="edition">

                <div class="edition-header">
                    <div>
                        <h2>Bedrock Edition</h2>
                        <p class="edition-subtitle">Minecraft Bedrock Edition</p>
                    </div>

                    <div id="bedrock-status-badge" class="badge offline">
                        <span class="dot"></span>
                        <span id="bedrock-status-text">OFFLINE</span>
                    </div>
                </div>


                <div class="stats">

                    <div class="stat">
                        <span class="label">Ping</span>
                        <strong id="bedrock-ping">—</strong>
                    </div>

                    <div class="stat">
                        <span class="label">Version</span>
                        <strong id="bedrock-version">Unknown</strong>
                    </div>

                </div>

            </div>


            <div class="divider"></div>


            <!-- ================= SHARED PLAYER COUNT ================= -->

            <div class="players-section">

                <div class="shared-player-count">
                    <span class="label">Players Online</span>
                    <strong id="players">—</strong>
                </div>


                <div class="online-players">

                    <span class="label">Online Players</span>

                    <div id="java-player-list" class="player-list">
                        <span class="no-players">
                            No players online
                        </span>
                    </div>

                </div>

            </div>


            <!-- ================= FOOTER ================= -->

            <div class="footer">

                <span id="last-updated">
                    Checking status...
                </span>

                <button onclick="checkStatus()">
                    Refresh
                </button>

            </div>

        </section>

    </main>


    <script>

        /*
         * Update ONLINE / OFFLINE badge
         */
        function updateBadge(badge, textElement, online) {

            badge.classList.remove("online", "offline");

            badge.classList.add(
                online ? "online" : "offline"
            );

            textElement.textContent =
                online ? "ONLINE" : "OFFLINE";
        }


        /*
         * =========================
         * JAVA STATUS
         * =========================
         */

        function updateJavaStatus(java) {

            const badge =
                document.getElementById("java-status-badge");

            const statusText =
                document.getElementById("java-status-text");

            const ping =
                document.getElementById("java-ping");

            const version =
                document.getElementById("java-version");

            const players =
                document.getElementById("players");

            const playerList =
                document.getElementById("java-player-list");


            updateBadge(
                badge,
                statusText,
                java.online
            );


            if (java.online) {

                /*
                 * Java is the PRIMARY source
                 * for the shared player count.
                 */
                players.textContent =
                    `${java.players} / ${java.max_players}`;


                /*
                 * Java ping
                 */
                ping.textContent =
                    java.ping !== null
                        ? `${java.ping} ms`
                        : "—";


                /*
                 * Java version
                 */
                version.textContent =
                    java.version || "Unknown";


                /*
                 * Online player names
                 */
                playerList.innerHTML = "";


                if (
                    java.player_names &&
                    java.player_names.length > 0
                ) {

                    java.player_names.forEach(name => {

                        const player =
                            document.createElement("span");

                        player.className = "player";

                        player.textContent = name;

                        playerList.appendChild(player);

                    });

                } else {

                    playerList.innerHTML =
                        '<span class="no-players">No players online</span>';

                }

            } else {

                ping.textContent = "—";
                version.textContent = "Unknown";

                /*
                 * If Java is offline, we don't have
                 * a reliable shared player count.
                 */
                players.textContent = "—";


                playerList.innerHTML =
                    '<span class="no-players">Server is offline</span>';
            }
        }


        /*
         * =========================
         * BEDROCK STATUS
         * =========================
         */

        function updateBedrockStatus(bedrock) {

            const badge =
                document.getElementById("bedrock-status-badge");

            const statusText =
                document.getElementById("bedrock-status-text");

            const ping =
                document.getElementById("bedrock-ping");

            const version =
                document.getElementById("bedrock-version");


            updateBadge(
                badge,
                statusText,
                bedrock.online
            );


            if (bedrock.online) {

                /*
                 * Bedrock has its own ping.
                 */
                ping.textContent =
                    bedrock.ping !== null
                        ? `${bedrock.ping} ms`
                        : "—";


                /*
                 * Bedrock has its own version.
                 */
                version.textContent =
                    bedrock.version || "Unknown";

            } else {

                ping.textContent = "—";
                version.textContent = "Unknown";
            }
        }


        /*
         * =========================
         * CHECK STATUS
         * =========================
         */

        async function checkStatus() {

            const updated =
                document.getElementById("last-updated");


            try {

                const response =
                    await fetch("/api/status");


                if (!response.ok) {
                    throw new Error(
                        "Server returned an error"
                    );
                }


                const data =
                    await response.json();


                /*
                 * Java controls:
                 * - Player count
                 * - Player names
                 * - Java ping
                 * - Java version
                 * - Java status
                 */
                updateJavaStatus(data.java);


                /*
                 * Bedrock controls:
                 * - Bedrock status
                 * - Bedrock ping
                 * - Bedrock version
                 */
                updateBedrockStatus(data.bedrock);


                updated.textContent =
                    "Last checked: " +
                    new Date().toLocaleTimeString();


            } catch (error) {

                console.error(
                    "Status check failed:",
                    error
                );


                updateJavaStatus({
                    online: false,
                    players: 0,
                    max_players: 0,
                    version: "Unknown",
                    ping: null,
                    player_names: []
                });


                updateBedrockStatus({
                    online: false,
                    version: "Unknown",
                    ping: null
                });


                updated.textContent =
                    "Unable to check server";
            }
        }


        /*
         * Initial check
         */
        checkStatus();


        /*
         * Automatically update every 10 seconds
         */
        setInterval(
            checkStatus,
            10000
        );

    </script>

</body>
</html>
